 cy="210" r="18" fill="#deb96a"/><text x="90" y="215" text-anchor="middle" fill="#08101e" font-size="15">6</text><rect x="2" y="234" width="176" height="29" rx="6" fill="#10253c"/><text x="90" y="254" text-anchor="middle" fill="#eef5fa" font-size="14">F 핵/기억 기록실</text><circle cx="90" cy="340" r="18" fill="#deb96a"/><text x="90" y="345" text-anchor="middle" fill="#08101e" font-size="15">7</text><rect x="2" y="364" width="176" height="29" rx="6" fill="#10253c"/><text x="90" y="384" text-anchor="middle" fill="#eef5fa" font-size="14">G 귀환·개인 보고</text><text x="20" y="445" fill="#9cb9d2" font-size="13">구역 내부 연결도 · 축척 아님 · 장치는 솔로 순차 처리 가능</text></svg>